spring.application.name=webtech
server.port=${PORT:8080}

# Datenbank (z.B. Neon Free Tier). Werte kommen aus den Render-Umgebungsvariablen.
# JDBC_DATABASE_URL Beispiel: jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

# Kleiner Pool, der Verbindungen regelmaessig erneuert: Neon pausiert die DB nach
# ~5 Min Inaktivitaet und trennt dabei offene Verbindungen. So werden keine toten
# Verbindungen wiederverwendet und die DB darf schlafen (spart Free-Kontingent).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
